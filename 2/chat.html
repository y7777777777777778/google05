<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>チャット</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#000;
  --bg2:#1C1C1E;
  --bg3:#2C2C2E;
  --bg4:#3A3A3C;
  --sep:rgba(84,84,88,.65);
  --sep2:rgba(84,84,88,.35);
  --fill:rgba(120,120,128,.2);
  --fill2:rgba(120,120,128,.16);
  --fill3:rgba(120,120,128,.1);
  --t1:#fff;
  --t2:rgba(235,235,245,.6);
  --t3:rgba(235,235,245,.3);
  --t4:rgba(235,235,245,.16);
  --blue:#0A84FF;
  --blue-l:#409CFF;
  --green:#30D158;
  --red:#FF453A;
  --gold:#FFD60A;
  --teal:#5AC8FA;
  --glass:rgba(26,26,28,.97);
  --blur:blur(32px) saturate(180%);
  --r1:8px;
  --r2:12px;
  --r3:16px;
  --r4:20px;
}

*{ margin:0; padding:0; box-sizing:border-box; }
html,body{ width:100%; height:100%; overflow:hidden; }
body{ font-family:'Figtree',sans-serif; background:var(--bg); color:var(--t1); }

.wall{
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(circle at 10% 0%, #153060 0%, transparent 35%),
    radial-gradient(circle at 90% 20%, #111f48 0%, transparent 40%),
    radial-gradient(circle at 70% 80%, #21092f 0%, transparent 40%),
    #02040b;
}

#app{
  position:relative; z-index:10; width:100%; height:100vh;
  display:flex; flex-direction:column;
}

/* トップ */
#topBar{
  height:44px; flex-shrink:0;
  display:flex; align-items:center; gap:6px;
  padding:0 10px;
  background:var(--glass);
  backdrop-filter:var(--blur);
  -webkit-backdrop-filter:var(--blur);
  border-bottom:.5px solid var(--sep);
}

#modePill{
  display:flex; gap:2px;
  padding:3px; border-radius:var(--r2);
  background:var(--fill3);
  flex-shrink:0;
}

.mpill{
  position:relative; border:none; background:transparent;
  color:var(--t3); padding:3px 14px; border-radius:7px;
  font-size:12px; font-weight:600; cursor:pointer; transition:.15s;
}
.mpill:hover{ color:var(--t1); }
.mpill.on{ background:var(--bg3); color:#fff; }

.pill-badge{
  position:absolute; top:-4px; right:-3px;
  min-width:14px; height:14px; padding:0 3px; border-radius:7px;
  background:var(--red); color:#fff;
  display:none; align-items:center; justify-content:center;
  font-size:9px; font-weight:700;
}
.pill-badge.on{ display:flex; }

/* 名前インライン入力エリア */
#nameArea{
  margin-left:auto;
  display:flex; align-items:center; gap:5px;
  flex-shrink:0;
}

#nameInlineInput{
  height:28px;
  border:.5px solid var(--sep2);
  border-radius:var(--r1);
  background:var(--fill2);
  color:#fff;
  padding:0 9px;
  font-size:12px;
  font-weight:600;
  font-family:'Figtree',sans-serif;
  outline:none;
  width:96px;
  transition:border .15s, box-shadow .15s;
}
#nameInlineInput:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 2px rgba(10,132,255,.2);
}
#nameInlineInput::placeholder{ color:var(--t4); font-weight:400; }

#nameApplyBtn{
  height:28px; padding:0 10px;
  border:none; border-radius:var(--r1);
  background:var(--blue); color:#fff;
  font-size:11px; font-weight:600;
  font-family:'Figtree',sans-serif;
  cursor:pointer; transition:background .12s;
  flex-shrink:0;
}
#nameApplyBtn:hover{ background:#1a8fff; }

#selfCode{
  font-size:11px; font-weight:700;
  color:var(--blue-l);
  background:rgba(10,132,255,.15);
  padding:2px 7px; border-radius:5px;
  flex-shrink:0;
}

.xbtn{
  width:26px; height:26px; border:none; border-radius:50%;
  background:var(--fill2); color:var(--t2); cursor:pointer;
  flex-shrink:0; display:flex; align-items:center; justify-content:center;
  font-size:14px;
}
.xbtn:hover{ background:var(--fill); }

/* ルームバー */
#roomBar{
  height:38px; flex-shrink:0;
  display:flex; align-items:center; gap:4px;
  overflow-x:auto; padding:5px 10px;
  background:rgba(26,26,28,.8);
  border-bottom:.5px solid var(--sep2);
}
#roomBar::-webkit-scrollbar{ display:none; }

.rbtn{
  border:none; background:var(--fill3); color:var(--t3);
  padding:4px 11px; border-radius:var(--r1);
  font-size:12px; cursor:pointer; white-space:nowrap;
}
.rbtn.on{ background:var(--bg3); color:#fff; }

/* メイン */
#mainArea{ flex:1; overflow:hidden; display:flex; }

#roomPane{ flex:1; display:flex; flex-direction:column; overflow:hidden; }

#msgList{
  flex:1; overflow-y:auto;
  padding:10px 12px;
  display:flex; flex-direction:column; gap:5px;
}
#msgList::-webkit-scrollbar{ width:3px; }
#msgList::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.1); border-radius:2px; }

.mrow{ display:flex; flex-direction:column; gap:2px; }
.mrow.admin-row{
  padding-left:6px;
  border-left:2px solid rgba(255,214,10,.35);
  background:linear-gradient(90deg,rgba(255,214,10,.06),transparent 70%);
}

.mmeta{ display:flex; align-items:center; gap:5px; flex-wrap:wrap; }

.mname{ color:var(--blue-l); font-size:12px; font-weight:600; cursor:pointer; }
.mname.me{ color:var(--teal); }
.mname.admin-gold{ color:var(--gold)!important; text-shadow:0 0 8px rgba(255,214,10,.5); }
.mname.admin-gold::after{ content:" 👑"; font-size:10px; }

.mcode{ font-size:10px; color:var(--t4); }
.mts{ font-size:10px; color:var(--t4); }
.mbody{ font-size:13px; color:var(--t2); line-height:1.55; word-break:break-word; }
.mreply{ font-size:10px; color:var(--t4); border-left:2px solid var(--sep); padding-left:6px; }

.mbody-img{ margin-top:2px; }
.mbody-img img{
  max-width:220px; max-height:220px;
  border-radius:10px; cursor:pointer;
  display:block; border:.5px solid var(--sep2);
}

/* 入力フッター */
#roomFoot{
  flex-shrink:0;
  border-top:.5px solid var(--sep2);
  padding:8px 10px;
  background:var(--glass);
}

#replyBar{
  display:none; align-items:center; gap:6px;
  margin-bottom:5px;
  background:var(--fill3); border-radius:var(--r1);
  padding:3px 8px; font-size:11px; color:var(--t4);
}
#replyBar.on{ display:flex; }
#replyTxt{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#replyClear{ border:none; background:none; color:var(--t4); cursor:pointer; }

.img-preview-bar{ display:none; margin-bottom:6px; }
.img-preview-bar.on{ display:block; }
.img-preview{
  position:relative; display:inline-block;
  border-radius:var(--r2); overflow:hidden;
  border:.5px solid var(--sep2);
}
.img-preview img{ display:block; max-height:90px; max-width:140px; }
.img-preview-remove{
  position:absolute; top:3px; right:3px;
  width:20px; height:20px; border-radius:50%;
  border:none; background:rgba(0,0,0,.6); color:#fff;
  font-size:11px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}

.irow{ display:flex; align-items:center; gap:6px; }

.minput{
  flex:1; height:34px; border-radius:17px;
  border:.5px solid var(--sep2);
  background:var(--fill2); color:#fff;
  padding:0 13px; outline:none; font-size:13px;
  font-family:'Figtree',sans-serif;
}
.minput:focus{ border-color:var(--blue); }

.sbtn{
  width:34px; height:34px; border:none; border-radius:50%;
  background:var(--blue); color:#fff; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0;
}

.img-btn{
  background:var(--fill2); color:var(--t2);
}
.img-btn:hover{ background:var(--fill); }

/* DM */
#dmPane{ display:none; flex:1; overflow:hidden; }
#dmPane.on{ display:flex; }

#dmList{
  width:200px; flex-shrink:0;
  border-right:.5px solid var(--sep2);
  background:rgba(20,20,22,.9);
  display:flex; flex-direction:column;
}

.dl-hd{
  padding:8px 10px 4px;
  font-size:10px; font-weight:700;
  color:var(--t4);
  border-bottom:.5px solid var(--sep2);
}

#dmUserList{ flex:1; overflow-y:auto; }

.duitem{
  display:flex; align-items:center; gap:7px;
  padding:8px 10px; cursor:pointer;
  border-bottom:.5px solid var(--sep2);
}
.duitem:hover{ background:var(--fill3); }
.duitem.on{ background:rgba(10,132,255,.1); }

.duav{
  width:28px; height:28px; border-radius:50%;
  background:var(--bg3);
  display:flex; align-items:center; justify-content:center;
  font-size:12px; font-weight:600; flex-shrink:0;
}
.duav.admin-av{ background:linear-gradient(135deg,#b8860b,#ffd700); color:#000; }

.duinfo{ flex:1; overflow:hidden; }
.duname{ font-size:12px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.duname.admin-gold-dm{ color:var(--gold); }
.ducode{ font-size:10px; color:var(--t4); }

.dubadge{
  min-width:15px; height:15px;
  display:none; align-items:center; justify-content:center;
  border-radius:7px; padding:0 3px;
  background:var(--red); color:#fff;
  font-size:9px; font-weight:700;
}
.dubadge.on{ display:flex; }

/* DM会話 */
#dmConv{ flex:1; display:none; flex-direction:column; overflow:hidden; }
#dmConv.on{ display:flex; }

#dmConvHd{
  padding:8px 12px;
  border-bottom:.5px solid var(--sep2);
  display:flex; align-items:center; gap:8px;
  background:rgba(28,28,30,.6);
}

#dmBackBtn{ border:none; background:none; color:var(--blue); cursor:pointer; font-size:14px; }
#dmConvName{ font-size:13px; font-weight:600; }
#dmConvCode{ font-size:10px; color:var(--t4); }

#dmMsgList{
  flex:1; overflow-y:auto;
  padding:10px 12px;
  display:flex; flex-direction:column; gap:5px;
}

.dmbrow{ display:flex; flex-direction:column; }
.dmbrow.mine{ align-self:flex-end; align-items:flex-end; max-width:78%; }
.dmbrow.theirs{ align-self:flex-start; max-width:78%; }

.dmb{
  padding:7px 12px; border-radius:var(--r2);
  font-size:13px; line-height:1.5; word-break:break-word;
}
.mine .dmb{ background:var(--blue); color:#fff; border-radius:var(--r2) var(--r2) 4px var(--r2); }
.theirs .dmb{ background:var(--bg3); border-radius:var(--r2) var(--r2) var(--r2) 4px; }
.dmb.has-image{ padding:5px; background:rgba(120,120,128,.18); }
.dmb img{
  max-width:200px; max-height:200px;
  border-radius:8px; cursor:pointer; display:block;
}
.dmb img + div, .dmb div + img{ margin-top:5px; }
.dmts{ font-size:9px; color:var(--t4); }

.empty-hint{
  flex:1; display:flex; align-items:center; justify-content:center;
  color:var(--t4); font-size:13px;
}

/* 名前未設定のオーバーレイ */
#namePrompt{
  position:fixed; inset:0; z-index:9999;
  background:rgba(0,0,0,.75);
  backdrop-filter:blur(10px);
  display:flex; align-items:center; justify-content:center;
}
#namePromptBox{
  background:var(--bg2);
  border:.5px solid var(--sep);
  border-radius:var(--r3);
  padding:24px 20px;
  width:260px;
  display:flex; flex-direction:column; gap:12px;
  animation:ncIn .25s cubic-bezier(.34,1.28,.64,1) both;
}
@keyframes ncIn{
  from{ opacity:0; transform:scale(.88) translateY(16px); }
  to{ opacity:1; transform:scale(1) translateY(0); }
}
#namePromptBox h3{ font-size:14px; font-weight:700; }
#namePromptBox p{ font-size:12px; color:var(--t3); line-height:1.5; }
#namePromptInput{
  height:36px;
  border:.5px solid var(--sep);
  border-radius:var(--r1);
  background:var(--fill2); color:#fff;
  padding:0 12px; outline:none;
  font-size:13px; font-family:'Figtree',sans-serif;
}
#namePromptInput:focus{ border-color:var(--blue); }
#namePromptErr{ font-size:11px; color:var(--red); min-height:14px; }
#namePromptBtn{
  height:36px; border:none; border-radius:var(--r1);
  background:var(--blue); color:#fff;
  font-size:13px; font-weight:600;
  font-family:'Figtree',sans-serif;
  cursor:pointer;
}
#namePromptBtn:hover{ background:#1a8fff; }

/* ライトボックス（画像拡大表示） */
#lightbox{
  position:fixed; inset:0; z-index:99999;
  background:rgba(0,0,0,.92);
  display:none; align-items:center; justify-content:center;
  padding:24px;
  cursor:zoom-out;
}
#lightbox.on{ display:flex; }
#lightbox img{
  max-width:100%; max-height:100%;
  border-radius:10px;
  box-shadow:0 10px 40px rgba(0,0,0,.5);
}

@media(max-width:720px){
  #dmList{ width:100%; }
  #dmConv{ position:absolute; inset:0; z-index:50; background:#000; }
}
</style>
</head>

<body>
<div class="wall"></div>

<div id="app">

  <!-- トップバー -->
  <div id="topBar">

    <div id="modePill">
      <button class="mpill on" id="pillRoom" onclick="setMode('room')">
        部屋
        <span class="pill-badge" id="pb_room"></span>
      </button>
      <button class="mpill" id="pillDm" onclick="setMode('dm')">
        DM
        <span class="pill-badge" id="pb_dm"></span>
      </button>
    </div>

    <!-- 名前インライン入力 -->
    <div id="nameArea">
      <input
        id="nameInlineInput"
        maxlength="20"
        placeholder="名前を入力..."
        autocomplete="off"
        spellcheck="false"
      >
      <button id="nameApplyBtn" onclick="applyName()">決定</button>
      <span id="selfCode">----</span>
      <button class="xbtn" onclick="openFullscreen()" title="大画面で開く" style="background:rgba(10,132,255,.15);color:var(--blue-l);">⤢</button>
      <button class="xbtn" onclick="closeChat()">✕</button>
    </div>

  </div>

  <!-- ルームバー -->
  <div id="roomBar"></div>

  <!-- メイン -->
  <div id="mainArea">

    <!-- 部屋 -->
    <div id="roomPane">
      <div id="msgList"></div>
      <div id="roomFoot">
        <div id="replyBar">
          <span>↩</span>
          <span id="replyTxt"></span>
          <button id="replyClear" onclick="clearReply()">✕</button>
        </div>
        <div id="imgPreviewBar" class="img-preview-bar"></div>
        <div class="irow">
          <input type="file" id="roomImgInput" accept="image/*" style="display:none" onchange="handleImageFile(event,'room')">
          <button class="sbtn img-btn" onclick="document.getElementById('roomImgInput').click()" title="画像を送信">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
              <circle cx="12" cy="13" r="4"/>
            </svg>
          </button>
          <input class="minput" id="msgInput" placeholder="メッセージを入力..." maxlength="200">
          <button class="sbtn" onclick="sendMsg()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round">
              <line x1="12" y1="19" x2="12" y2="5"/>
              <polyline points="5 12 12 5 19 12"/>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- DM -->
    <div id="dmPane">
      <div id="dmList">
        <div class="dl-hd">メンバー</div>
        <div id="dmUserList"><div class="empty-hint">読み込み中...</div></div>
      </div>
      <div id="dmConv">
        <div id="dmConvHd">
          <button id="dmBackBtn" onclick="closeDmConv()">‹ 戻る</button>
          <div>
            <div id="dmConvName"></div>
            <div id="dmConvCode"></div>
          </div>
        </div>
        <div id="dmMsgList"></div>
        <div id="roomFoot" style="border-top:.5px solid var(--sep2);padding:8px 10px;background:var(--glass);flex-shrink:0;">
          <div id="dmImgPreviewBar" class="img-preview-bar"></div>
          <div class="irow">
            <input type="file" id="dmImgInput" accept="image/*" style="display:none" onchange="handleImageFile(event,'dm')">
            <button class="sbtn img-btn" onclick="document.getElementById('dmImgInput').click()" title="画像を送信">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                <circle cx="12" cy="13" r="4"/>
              </svg>
            </button>
            <input class="minput" id="dmInput" placeholder="DMを送信..." maxlength="200">
            <button class="sbtn" onclick="sendDm()">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round">
                <line x1="12" y1="19" x2="12" y2="5"/>
                <polyline points="5 12 12 5 19 12"/>
              </svg>
            </button>
          </div>
        </div>
      </div>
      <div id="dmEmpty" class="empty-hint">左からユーザーを選択してください</div>
    </div>

  </div>
</div>

<!-- 名前未設定プロンプト -->
<div id="namePrompt" style="display:none;">
  <div id="namePromptBox">
    <h3>👋 表示名を入力してください</h3>
    <p>チャットで使う名前を設定します。あとから変更できます。</p>
    <input id="namePromptInput" maxlength="20" placeholder="名前（最大20文字）" autocomplete="off">
    <div id="namePromptErr"></div>
    <button id="namePromptBtn" onclick="submitPromptName()">はじめる</button>
  </div>
</div>

<!-- 画像拡大ライトボックス -->
<div id="lightbox" onclick="closeLightbox()">
  <img id="lightboxImg" src="" alt="">
</div>

<script>
/* ━━━ ユーティリティ ━━━ */
function esc(s){
  return String(s||'')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}
function fmt(ts){
  if(!ts||!ts.seconds)return'';
  return new Date(ts.seconds*1000).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
}
function safeid(s){ return String(s||'').replace(/[^a-zA-Z0-9]/g,'_'); }

/* ━━━ 名前管理 ━━━ */
// chatName_local を使用（peji.htmlとは独立）
let myName = localStorage.getItem('chatName_local') || '';
let myCode = '----';

function initNameUI(){
  const inp = document.getElementById('nameInlineInput');
  inp.value = myName;

  if(!myName){
    // 名前未設定 → プロンプト表示
    document.getElementById('namePrompt').style.display = 'flex';
    setTimeout(()=> document.getElementById('namePromptInput').focus(), 80);
  }

  inp.addEventListener('keydown', e=>{ if(e.key==='Enter') applyName(); });
}

window.applyName = async function(){
  const inp = document.getElementById('nameInlineInput');
  const v = inp.value.trim();
  if(!v){ inp.focus(); return; }
  if(v === myName) return;

  // Firestore重複チェックはモジュール側で行うため、ここでは楽観的に適用
  myName = v;
  localStorage.setItem('chatName_local', v);
  inp.blur();
  // コード再取得
  await initCode();
};

window.submitPromptName = async function(){
  const inp = document.getElementById('namePromptInput');
  const errEl = document.getElementById('namePromptErr');
  const v = inp.value.trim();
  errEl.textContent = '';
  if(!v){ errEl.textContent = '名前を入力してください'; return; }
  myName = v;
  localStorage.setItem('chatName_local', v);
  document.getElementById('nameInlineInput').value = v;
  document.getElementById('namePrompt').style.display = 'none';
  await initCode();
};

document.getElementById('namePromptInput')?.addEventListener('keydown', e=>{
  if(e.key==='Enter') submitPromptName();
});

/* ━━━ モード切替 ━━━ */
let _mode = 'room';
function setMode(m){
  _mode = m;
  document.getElementById('pillRoom').classList.toggle('on', m==='room');
  document.getElementById('pillDm').classList.toggle('on', m==='dm');
  document.getElementById('roomBar').style.display = m==='room' ? 'flex' : 'none';
  document.getElementById('roomPane').style.display = m==='room' ? 'flex' : 'none';
  document.getElementById('dmPane').classList.toggle('on', m==='dm');
  if(m==='room') clearBadge('pb_room');
  if(m==='dm') clearBadge('pb_dm');
}

function clearBadge(id){
  const el=document.getElementById(id);
  el.classList.remove('on'); el.textContent='';
}
function addBadge(id,n){
  const el=document.getElementById(id);
  let cur=parseInt(el.textContent||'0')||0;

  el.textContent=cur; el.classList.add('on');
}

let _reply = null;
function setReply(name,text){
  _reply={name,text};
  document.getElementById('replyBar').classList.add('on');
  document.getElementById('replyTxt').textContent=name+'：'+text;

  document.getElementById('replyBar').classList.remove('on');
}

/* ━━━ 画像処理 ━━━ */
let pendingImageRoom = null;
let pendingImageDm = null;

function compressImage(file, maxDim, quality){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > h){ if(w > maxDim){ h = Math.round(h*maxDim/w); w = maxDim; } }
        else { if(h > maxDim){ w = Math.round(w*maxDim/h); h = maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = ()=> reject(new Error('画像を読み込めませんでした'));
      img.src = e.target.result;
    };
    reader.onerror = ()=> reject(new Error('ファイルを読み込めませんでした'));
    reader.readAsDataURL(file);
  });
}

async function getCompressedDataUrl(file){
  let quality = 0.75, maxDim = 1000;
  let dataUrl = await compressImage(file, maxDim, quality);
  let tries = 0;
  // Firestoreの1ドキュメント上限(約1MB)に収まるよう、大きすぎる場合は段階的に縮小
  while(dataUrl.length > 700000 && tries < 6){
    quality = Math.max(0.3, quality - 0.15);
    maxDim = Math.max(300, maxDim - 200);
    dataUrl = await compressImage(file, maxDim, quality);
    tries++;
  }
  return dataUrl;
}

function renderImgPreview(barId, dataUrl, target){
  const bar = document.getElementById(barId);
  bar.innerHTML = `
    <div class="img-preview">
      <img src="${dataUrl}">
      <button class="img-preview-remove" onclick="removePendingImage('${target}')">✕</button>
    </div>
  `;
  bar.classList.add('on');
}

window.handleImageFile = async function(e, target){
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if(!file) return;
  if(!file.type || !file.type.startsWith('image/')){
    alert('画像ファイルを選択してください');
    return;
  }
  try{
    const dataUrl = await getCompressedDataUrl(file);
    if(target === 'room'){
      pendingImageRoom = dataUrl;
      renderImgPreview('imgPreviewBar', dataUrl, 'room');
    } else {
      pendingImageDm = dataUrl;
      renderImgPreview('dmImgPreviewBar', dataUrl, 'dm');
    }
  }catch(err){
    console.error(err);
    alert('画像の処理に失敗しました');
  }
};

window.removePendingImage = function(target){
  if(target === 'room'){
    pendingImageRoom = null;
    const bar = document.getElementById('imgPreviewBar');
    bar.innerHTML = ''; bar.classList.remove('on');
  } else {
    pendingImageDm = null;
    const bar = document.getElementById('dmImgPreviewBar');
    bar.innerHTML = ''; bar.classList.remove('on');
  }
};

window.openLightboxFromImg = function(imgEl){
  document.getElementById('lightboxImg').src = imgEl.src;
  document.getElementById('lightbox').classList.add('on');
};
window.closeLightbox = function(){
  document.getElementById('lightbox').classList.remove('on');
  document.getElementById('lightboxImg').src = '';
};

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
import {
  getFirestore, collection, addDoc, query, limit, onSnapshot,
  serverTimestamp, doc, getDocs, where, updateDoc
} from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyDmv5WbPp6298HNLSOa6h0AMuieM0H6l1s",
  authDomain:"fir-66339.firebaseapp.com",
  projectId:"fir-66339",
  storageBucket:"fir-66339.firebasestorage.app",
  messagingSenderId:"876017617963",
  appId:"1:876017617963:web:5ba304f8f6e0d9dff0ae6e"
}, "chat_v3");

const db = getFirestore(app);

let myDocId = null;
let myIsAdmin = false;
let adminSet = new Set();

/* 管理者読み込み */
async function loadAdmins(){
  try{
    const snap = await getDocs(query(collection(db,'users'), where('isAdmin','==',true)));
    adminSet = new Set(snap.docs.map(d=>d.data().name));
  }catch(e){}
}

/* コード初期化 */
window.initCode = async function(){
  const name = localStorage.getItem('chatName_local') || '';
  if(!name) return;
  try{
    const q = await getDocs(query(collection(db,'users'), where('name','==',name)));
    if(!q.empty){
      const docRef = q.docs[0];
      const data = docRef.data();
      myDocId = docRef.id;
      myIsAdmin = data.isAdmin === true;
      let code = data.userCode;
      if(!code){
        for(let i=0;i<30;i++){
          const c = String(Math.floor(1000+Math.random()*9000));
          const dup = await getDocs(query(collection(db,'users'), where('userCode','==',c)));
          if(dup.empty){ code=c; break; }
        }
        await updateDoc(doc(db,'users',docRef.id), {userCode:code});
      }
      window.myCode = String(code);
      document.getElementById('selfCode').textContent = '#' + code;
    }
  }catch(e){ console.error(e); }
  loadUsers();
};

/* ルーム */
let rooms = [{id:'general',name:'全体'}];
let curRoom = 'general';
let msgUnsub = null;

function renderRooms(){
  document.getElementById('roomBar').innerHTML =
    rooms.map(r=>`
      <button class="rbtn${r.id===curRoom?' on':''}" onclick="switchRoom('${esc(r.id)}')">
        #${esc(r.name)}
      </button>
    `).join('');
}

window.switchRoom = function(id){
  curRoom = id;
  renderRooms();
  if(msgUnsub) msgUnsub();
  document.getElementById('msgList').innerHTML = '';
  subscribeRoomMsgs();
};

onSnapshot(doc(db,'config','chatRooms_2'), snap=>{
  if(snap.exists() && Array.isArray(snap.data().rooms)){
    const r = snap.data().rooms;
    rooms = [{id:'general',name:'全体'}, ...r.filter(x=>x.id!=='general')];
  } else {
    rooms = [{id:'general',name:'全体'}];
  }
  renderRooms();
});

/* NG */
let ngW = [];
onSnapshot(doc(db,'config','ngWords_2'), s=>{
  ngW = s.exists() ? (s.data().words||[]) : [];
});
function isNG(t){ return ngW.some(w=>t.toLowerCase().includes(w.toLowerCase())); }

/* メッセージ購読 */
function subscribeRoomMsgs(){
  msgUnsub = onSnapshot(
    query(collection(db,'chat_2'), where('roomId','==',curRoom), limit(80)),
    snap=>{
      const msgs = snap.docs
        .map(d=>({id:d.id,...d.data()}))
        .sort((a,b)=>(a.ts?.seconds??0)-(b.ts?.seconds??0));
      renderRoomMsgs(msgs);
    }
  );
}

function renderRoomMsgs(msgs){
  const el = document.getElementById('msgList');
  const atBot = el.scrollHeight - el.scrollTop - el.clientHeight < 80;
  el.innerHTML = msgs.map(m=>{
    const me = m.name === (localStorage.getItem('chatName_local')||'');
    const isAdmin = adminSet.has(m.name);
    let cls = 'mname';
    if(me) cls += ' me';
    if(isAdmin) cls += ' admin-gold';
    return `
      <div class="mrow${isAdmin?' admin-row':''}">
        <div class="mmeta">
          <span class="${cls}" onclick="setReply('${esc(m.name)}','${esc(m.text||'')}')">${esc(m.name)}</span>
          <span class="mcode">#${esc(m.userCode||'----')}</span>
          <span class="mts">${fmt(m.ts)}</span>
        </div>
        ${m.replyTo ? `<div class="mreply">↩ ${esc(m.replyTo.name)}：${esc(m.replyTo.text)}</div>` : ''}
        ${m.text ? `<div class="mbody">${esc(m.text)}</div>` : ''}
        ${m.image ? `<div class="mbody-img"><img src="${m.image}" onclick="openLightboxFromImg(this)"></div>` : ''}
      </div>
    `;
  }).join('');
  if(atBot) el.scrollTop = el.scrollHeight;
}

window.sendMsg = async function(){
  const name = localStorage.getItem('chatName_local') || '';
  if(!name){ alert('先に名前を入力してください'); return; }
  const el = document.getElementById('msgInput');
  const text = el.value.trim();
  if(!text && !pendingImageRoom) return;
  if(text && isNG(text)) return;
  el.value = '';
  const data = {
    name,
    userCode: window.myCode || '----',
    text,
    roomId: curRoom,
    ts: serverTimestamp()
  };
  if(pendingImageRoom){ data.image = pendingImageRoom; }
  if(window._reply){
    data.replyTo = { name: window._reply.name, text: window._reply.text };
    clearReply();
  }
  try{
    await addDoc(collection(db,'chat_2'), data);
    removePendingImage('room');
  }catch(e){
    console.error(e);
    alert('送信に失敗しました（画像サイズが大きすぎる可能性があります）');
  }
};

document.getElementById('msgInput').addEventListener('keydown', e=>{
  if(e.key==='Enter') sendMsg();
});

/* DM */
let allUsers = [];
let dmUnread = {};
let dmTarget = null;
let dmUnsub = null;

window.loadUsers = async function(){
  try{
    const snap = await getDocs(
      query(collection(db,'users'), where('group','==','2'), where('status','==','ok'))
    );
    const name = localStorage.getItem('chatName_local') || '';
    allUsers = snap.docs
      .map(d=>({id:d.id,...d.data()}))
      .filter(u => u.name !== name && u.userCode);
    renderDmUserList();
  }catch(e){ console.error(e); }
};

function renderDmUserList(){
  const el = document.getElementById('dmUserList');
  if(!allUsers.length){
    el.innerHTML = '<div class="empty-hint">他のユーザーがいません</div>';
    return;
  }
  el.innerHTML = allUsers.map(u=>{
    const unr = dmUnread[u.name] || 0;
    const active = dmTarget && dmTarget.name === u.name;
    const isAdminUser = adminSet.has(u.name);
    return `
      <div class="duitem${active?' on':''}" onclick="openDm('${esc(u.name)}','${esc(u.userCode||'')}')">
        <div class="duav${isAdminUser?' admin-av':''}">${u.name.charAt(0)}</div>
        <div class="duinfo">
          <div class="duname${isAdminUser?' admin-gold-dm':''}">${esc(u.name)}${isAdminUser?' 👑':''}</div>
          <div class="ducode">#${esc(u.userCode||'----')}</div>
        </div>
        <span class="dubadge${unr?' on':''}" id="dub_${safeid(u.name)}">${unr||''}</span>
      </div>
    `;
  }).join('');
}

function dmKey(a,b){ return [a,b].sort().join('__'); }

window.openDm = function(name, code){
  dmTarget = {name, code};
  document.getElementById('dmConvName').textContent = name;
  document.getElementById('dmConvCode').textContent = '#' + code;
  document.getElementById('dmConv').classList.add('on');
  document.getElementById('dmEmpty').style.display = 'none';
  dmUnread[name] = 0;
  renderDmUserList();
  if(dmUnsub) dmUnsub();
  const key = dmKey(localStorage.getItem('chatName_local')||'', name);
  dmUnsub = onSnapshot(
    query(collection(db,'dm_2'), where('dmKey','==',key), limit(100)),
    snap=>{
      const msgs = snap.docs
        .map(d=>({id:d.id,...d.data()}))
        .sort((a,b)=>(a.ts?.seconds??0)-(b.ts?.seconds??0));
      renderDmMsgs(msgs);
    }
  );
};

function renderDmMsgs(msgs){
  const el = document.getElementById('dmMsgList');
  const atBot = el.scrollHeight - el.scrollTop - el.clientHeight < 60;
  const name = localStorage.getItem('chatName_local') || '';
  el.innerHTML = msgs.map(m=>{
    const mine = m.from === name;
    return `
      <div class="dmbrow ${mine?'mine':'theirs'}">
        <div class="dmb${m.image?' has-image':''}">
          ${m.text ? `<div>${esc(m.text)}</div>` : ''}
          ${m.image ? `<img src="${m.image}" onclick="openLightboxFromImg(this)">` : ''}
        </div>
        <span class="dmts">${fmt(m.ts)}</span>
      </div>
    `;
  }).join('');
  if(atBot) el.scrollTop = el.scrollHeight;
}

window.sendDm = async function(){
  if(!dmTarget) return;
  const name = localStorage.getItem('chatName_local') || '';
  if(!name){ alert('先に名前を入力してください'); return; }
  const el = document.getElementById('dmInput');
  const text = el.value.trim();
  if(!text && !pendingImageDm) return;
  if(text && isNG(text)) return;
  el.value = '';
  const data = {
    from: name,
    to: dmTarget.name,
    dmKey: dmKey(name, dmTarget.name),
    text,
    ts: serverTimestamp()
  };
  if(pendingImageDm){ data.image = pendingImageDm; }
  try{
    await addDoc(collection(db,'dm_2'), data);
    removePendingImage('dm');
  }catch(e){
    console.error(e);
    alert('送信に失敗しました（画像サイズが大きすぎる可能性があります）');
  }
};

document.getElementById('dmInput').addEventListener('keydown', e=>{
  if(e.key==='Enter') sendDm();
});

window.closeDmConv = function(){
  if(dmUnsub) dmUnsub();
  dmTarget = null;
  document.getElementById('dmConv').classList.remove('on');
  document.getElementById('dmEmpty').style.display = '';
  renderDmUserList();
};

onSnapshot(
  query(collection(db,'dm_2'), where('to','==', localStorage.getItem('chatName_local')||'__none__'), limit(50)),
  snap=>{
    snap.docChanges().forEach(ch=>{
      if(ch.type !== 'added') return;
      const d = ch.doc.data();
      if(dmTarget && dmTarget.name === d.from) return;
      dmUnread[d.from] = (dmUnread[d.from]||0) + 1;
      addBadge('pb_dm', 1);
      renderDmUserList();
    });
  }
);

/* 初期化 */
loadAdmins();
renderRooms();
subscribeRoomMsgs();
setMode('room');
initNameUI();
if(localStorage.getItem('chatName_local')){
  window.initCode();
}
</script>
