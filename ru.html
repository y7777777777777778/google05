  beat();setInterval(beat,20000);watchPresence();setInterval(watchPresence,30000);
  onSnapshot(query(collection(db,'rounds'),orderBy('t','desc'),limit(14)),s=>{lastDocs=s.docs.map(d=>({id:d.id,idx:d.data().idx}));drawLast()});
  onSnapshot(query(collection(db,'players'),orderBy('best','desc'),limit(5)),s=>{const ol=el('rk');ol.textContent='';
    s.docs.forEach((d,i)=>{const li=document.createElement('li'),b=document.createElement('b');li.append((i+1)+'. '+d.data().name);b.textContent=d.data().best;li.append(b);ol.append(li)});
    if(!s.docs.length)ol.innerHTML='<li>まだ記録がありません</li>'});
  onSnapshot(query(collection(db,'feed'),orderBy('t','desc'),limit(1)),s=>{s.docChanges().forEach(c=>{if(c.type!=='added')return;const d=c.doc.data();
    if(d.uid===uid||!d.t||d.t.toMillis()<t0)return;el('tk').textContent=d.name+'さんが'+d.win+'枚ゲット！'})});
  onSnapshot(query(collection(db,'chat'),orderBy('t','desc'),limit(30)),s=>{const c=el('cm');c.textContent='';[...s.docs].reverse().forEach(d=>{const x=d.data(),p=document.createElement('p'),b=document.createElement('b');b.textContent=x.name+'：';p.append(b,x.text);c.append(p)});c.scrollTop=c.scrollHeight});
  tick();setInterval(tick,200)}
const LID=()=>{let i=localStorage.getItem('rp_uid');if(!i){i='L'+Math.random().toString(36).slice(2,12);localStorage.setItem('rp_uid',i)}return i};
(async()=>{try{const a=JSON.parse(localStorage.getItem('rp_acct')||'null');if(a){const d=await getDoc(doc(db,'users',a.u));if(d.exists()&&d.data().pwHash===a.h)acct=a;else localStorage.removeItem('rp_acct')}}catch(e){}await setUser(false)})();
</script>
